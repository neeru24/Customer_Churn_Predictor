<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Churn Prediction Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="icon" type="image/png" href="/static/image.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <style>
    .animated-bg {
      position: fixed; width: 100%; height: 100%;
      background: linear-gradient(-45deg, #1e3a8a, #0f766e, #7e22ce, #9333ea);
      background-size: 400% 400%; animation: gradientMove 15s ease infinite; z-index: -4;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4;
      animation: float 20s ease-in-out infinite alternate; z-index: -2;
    }
    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      100% { transform: translateY(60px) translateX(80px); }
    }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-x-hidden relative">

  <!-- Background -->
  <div class="animated-bg"></div>
  <div class="blob w-[300px] h-[300px] bg-purple-700 top-10 left-10"></div>
  <div class="blob w-[200px] h-[200px] bg-pink-600 bottom-20 right-1/4"></div>
  <div id="tsparticles" class="absolute top-0 left-0 w-full h-full z-0"></div>

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-gray-900 bg-opacity-80 backdrop-blur-md px-4 sm:px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-bold text-yellow-400">🔍 Churn Predictor</div>
    
    <!-- Mobile menu button -->
    <button id="menu-toggle" class="text-yellow-400 md:hidden text-2xl focus:outline-none" aria-label="Toggle menu">
      ☰
    </button>
    
    <!-- Desktop menu -->
    <div class="hidden md:flex space-x-6 text-white">
      <a href="/" class="hover:text-yellow-300 transition">Home</a>
      <a href="/#features" class="hover:text-yellow-300 transition">Features</a>
      <a href="/#about" class="hover:text-yellow-300 transition">About</a>
      <a href="/how-to-use" class="hover:text-yellow-300 transition">How to Use</a>
      <a href="/form" class="hover:text-yellow-300 transition">Get Started</a>
    </div>
    
    <!-- Mobile menu (hidden by default) -->
    <div id="mobile-menu" class="md:hidden absolute top-full left-0 w-full bg-gray-900 bg-opacity-95 backdrop-blur-md py-4 px-6 hidden flex-col space-y-4">
      <a href="/" class="text-white hover:text-yellow-300 transition">Home</a>
      <a href="/#features" class="text-white hover:text-yellow-300 transition">Features</a>
      <a href="/#about" class="text-white hover:text-yellow-300 transition">About</a>
      <a href="/how-to-use" class="text-white hover:text-yellow-300 transition">How to Use</a>
      <a href="/form" class="text-white hover:text-yellow-300 transition">Get Started</a>
    </div>
  </nav>

  <!-- Form & Charts -->
  <div class="relative z-10 flex flex-col items-center pt-10 pb-20 px-4 w-full">
    <h1 class="text-3xl font-bold mb-6 text-yellow-400 text-center">Customer Churn Prediction Form</h1>
    <form id="churnForm" class="w-full max-w-md space-y-4 bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-md">
      <input type="number" name="tenure" placeholder="Tenure (months)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <input type="number" name="MonthlyCharges" placeholder="Monthly Charges (₹)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <input type="number" name="TotalCharges" placeholder="Total Charges (₹)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <select name="Contract" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
        <option disabled selected value="">Contract Type</option>
        <option>Month-to-month</option><option>One year</option><option>Two year</option>
      </select>
      <select name="InternetService" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
        <option disabled selected value="">Internet Service</option>
        <option>DSL</option><option>Fiber optic</option><option>No</option>
      </select>
      <select name="TechSupport" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
        <option disabled selected value="">Tech Support</option>
        <option>Yes</option><option>No</option><option>No internet service</option>
      </select>
      <select name="OnlineSecurity" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
        <option disabled selected value="">Online Security</option>
        <option>Yes</option><option>No</option><option>No internet service</option>
      </select>
      <select name="PaymentMethod" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
        <option disabled selected value="">Payment Method</option>
        <option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option>
      </select>
      <button type="submit" class="w-full bg-yellow-400 text-black font-semibold py-2 rounded hover:bg-yellow-300 transition">🔍 Predict</button>
    </form>

    <div id="resultContainer" class="mt-8 hidden w-full max-w-4xl text-center">
      <h2 id="resultText" class="text-2xl font-semibold mb-2"></h2>
      <p id="confidenceText" class="text-lime-400 text-lg mb-6"></p>
      <br><br>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 justify-items-center">
        <canvas id="barChart" width="250" height="250"></canvas>
        <canvas id="doughnutChart" width="250" height="250"></canvas>
        <canvas id="polarChart" width="250" height="250"></canvas>
      </div>
      <br>
      <div class="text-center mt-6">
        <button onclick="exportPDF()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">📄 Export Prediction as PDF</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 text-center py-6 border-t border-gray-800 relative z-10">
    Made with 💕 by Neeru | Customer Churn Predictor
  </footer>

  <!-- Scripts -->
  <script>
    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      particles: {
        number: { value: 80 }, color: { value: "#ffffff" },
        size: { value: 1.5 }, move: { enable: true, speed: 0.3 },
        opacity: { value: 0.4 }, links: { enable: true, distance: 100, opacity: 0.2 }
      },
      background: { color: "#0c0c1c" }
    });

    // Mobile menu toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
      const menuToggle = document.getElementById('menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      
      menuToggle.addEventListener('click', function() {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
        
        // Change menu icon based on state
        if (mobileMenu.classList.contains('hidden')) {
          menuToggle.textContent = '☰';
        } else {
          menuToggle.textContent = '✕';
        }
      });
      
      // Close menu when clicking on a link
      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          mobileMenu.classList.remove('flex');
          menuToggle.textContent = '☰';
        });
      });
    });

    const form = document.getElementById("churnForm");
    const resultText = document.getElementById("resultText");
    const confidenceText = document.getElementById("confidenceText");
    const resultContainer = document.getElementById("resultContainer");
    let chart1, chart2, chart3;

    form.addEventListener("submit", async e => {
      e.preventDefault();
      resultText.innerText = "⏳ Predicting...";
      resultContainer.classList.add("hidden");

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await (await fetch("/predict", {
          method: "POST", body: new URLSearchParams(data)
        })).json();

        if (res.error) {
          resultText.innerText = res.error;
        } else {
          resultContainer.classList.remove("hidden");
          resultText.innerText = res.result === "Churn" ? "⚠️ Customer may churn" : "✅ Customer will not churn";
          confidenceText.innerText = `Confidence: ${res.confidence}`;
          const churnVal = parseFloat(res.confidence);
          drawCharts(churnVal, res.result);
        }
      } catch {
        resultText.innerText = "❌ Prediction failed. Try again.";
      }
    });

    function drawCharts(confidence, resultLabel) {
      const churn = confidence;
      const notChurn = 100 - churn;
      const data = {
        labels: ["Churn", "Not Churn"],
        datasets: [{ data: [churn, notChurn], backgroundColor: ['#ef4444','#10b981'] }]
      };
      const opts = { responsive:false, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{enabled:true}}};
      [chart1,chart2,chart3].forEach(c=>c&&c.destroy());
      chart1 = new Chart("barChart",{type:'bar',data,options:opts});
      chart2 = new Chart("doughnutChart",{type:'doughnut',data,options:opts});
      chart3 = new Chart("polarChart",{type:'polarArea',data,options:opts});
    }

    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text("Churn Prediction Report",10,15);
      doc.setFontSize(12);
      doc.text(resultText.innerText,10,25);
      doc.text(confidenceText.innerText,10,32);
      doc.addPage();
      doc.setFontSize(14);
      doc.text("Charts",10,15);
      const ids = ["barChart","doughnutChart","polarChart"];
      ids.forEach((id, idx) => {
        const img = document.getElementById(id).toDataURL('image/png');
        const x = 10 + idx*60, y = 25;
        doc.addImage(img,'PNG',x,y,50,50);
      });
      doc.save("churn_report.pdf");
    }
  </script>
</body>
</html>
