<!-- templates/form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Churn Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-center items-center">
  <h1 class="text-3xl font-bold mb-6 text-yellow-400">📊 Churn Prediction Form</h1>

  <form id="churnForm" class="w-full max-w-md space-y-4 bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-md">
    <input type="number" name="tenure" placeholder="Tenure (months)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">

    <input type="number" name="MonthlyCharges" placeholder="Monthly Charges (₹)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">

    <input type="number" name="TotalCharges" placeholder="Total Charges (₹)" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">

    <select name="Contract" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <option disabled selected>Contract Type</option>
      <option>Month-to-month</option>
      <option>One year</option>
      <option>Two year</option>
    </select>

    <select name="InternetService" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <option disabled selected>Internet Service</option>
      <option>DSL</option>
      <option>Fiber optic</option>
      <option>No</option>
    </select>

    <select name="TechSupport" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <option disabled selected>Tech Support</option>
      <option>Yes</option>
      <option>No</option>
      <option>No internet service</option>
    </select>

    <select name="OnlineSecurity" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <option disabled selected>Online Security</option>
      <option>Yes</option>
      <option>No</option>
      <option>No internet service</option>
    </select>

    <select name="PaymentMethod" required class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded">
      <option disabled selected>Payment Method</option>
      <option>Electronic check</option>
      <option>Mailed check</option>
      <option>Bank transfer (automatic)</option>
      <option>Credit card (automatic)</option>
    </select>

    <button type="submit" class="w-full bg-yellow-400 text-black font-semibold py-2 rounded hover:bg-yellow-300 transition">
      🔍 Predict
    </button>
  </form>

  <h2 id="result" class="mt-6 text-xl font-bold text-lime-400"></h2>

  <script>
    const form = document.getElementById("churnForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      result.innerText = "⏳ Predicting...";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: new URLSearchParams(data),
        });

        const res = await response.json();
        result.innerText = res.result || res.error;
      } catch (err) {
        result.innerText = "❌ Error occurred.";
      }
    });
  </script>
</body>
</html>
